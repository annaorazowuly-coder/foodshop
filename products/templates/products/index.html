{% load static %}

<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FoodShop</title>

  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      margin: 0;
      font-family: 'Poppins', sans-serif;
      background: #f8f9fa;
      color: #333;
    }

    /* Header Buton ve Hover Efekti */
    .btn-light {
      border-radius: 20px;
      transition: 0.3s;
    }

    .btn-light:hover {
      background-color: #e6f4ff;
    }

    .dropdown-menu a.dropdown-item:hover {
      background-color: #e6f4ff;
      color: #0056ff;
    }

    /* Hero Bölümü */
    .hero {
      text-align: center;
      padding: 80px 20px;
      background: linear-gradient(135deg, #1677FF, #002aff);
      color: #fff;
    }

    .hero h1 {
      font-size: 48px;
      margin-bottom: 10px;
    }

    .hero p {
      font-size: 18px;
      margin-bottom: 20px;
    }

    .btn-custom {
      background: white;
      color: #1677FF;
      padding: 12px 30px;
      border-radius: 30px;
      font-weight: bold;
      text-decoration: none;
      transition: 0.3s;
    }

    .btn-custom:hover {
      background: #f1f1f1;
    }

    /* Ürün Kartları */
    .card img {
      height: 200px;
      object-fit: cover;
    }

    .card {
      transition: transform 0.3s, box-shadow 0.3s;
    }

    .card:hover {
      transform: translateY(-5px);
      box-shadow: 0 8px 20px rgba(0,0,0,0.15);
    }

    /* Footer */
    footer {
      background: #333;
      color: white;
      text-align: center;
      padding: 20px;
      margin-top: 40px;
    }

    /* Responsive Hero */
    @media (max-width: 576px) {
      .hero h1 { font-size: 32px; }
      .hero p { font-size: 16px; }
    }
  </style>
</head>
<body>

<!-- 🔹 Header -->
<header>
  <nav class="navbar navbar-expand-lg navbar-dark" style="background: linear-gradient(90deg, #1677FF, #0056FF);">
    <div class="container d-flex justify-content-between align-items-center">

      <!-- Sol: Dil Seçimi -->
      <div class="dropdown">
        <button class="btn btn-light btn-sm dropdown-toggle" type="button" id="languageDropdown" data-bs-toggle="dropdown" aria-expanded="false">
          Lang
        </button>
        <ul class="dropdown-menu" aria-labelledby="languageDropdown">
          <li><a class="dropdown-item" href="#">EN</a></li>
          <li><a class="dropdown-item" href="#">RU</a></li>
          <li><a class="dropdown-item" href="#">CN</a></li>
          <li><a class="dropdown-item" href="#">TM</a></li>
        </ul>
      </div>

      <!-- Ortada: Logo -->
      <a class="navbar-brand fw-bold mx-auto" href="#">🍎 FoodShop</a>

      <!-- Sağ: Account ikonu + dropdown (SVG) -->
      <div class="dropdown">
        <a class="btn btn-light btn-sm rounded-circle p-2" href="#" role="button" id="accountDropdown" data-bs-toggle="dropdown" aria-expanded="false">
          <!-- SVG Kullanıcı İkonu -->
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="#1677FF" class="bi bi-person-fill" viewBox="0 0 16 16">
            <path d="M3 14s-1 0-1-1 1-4 6-4 6 3 6 4-1 1-1 1H3zm5-6a3 3 0 1 0 0-6 3 3 0 0 0 0 6z"/>
          </svg>
        </a>
        <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="accountDropdown">
          <li><a class="dropdown-item" href="#">Profil</a></li>
          <li><a class="dropdown-item" href="#">Ayarlar</a></li>
          <li><hr class="dropdown-divider"></li>
          <li><a class="dropdown-item" href="#">Çıkış</a></li>
        </ul>
      </div>

    </div>
  </nav>
</header>

<!-- 🔹 Hero Bölümü -->
<section class="hero">
  <h1>Amatly bahadan azyk harytlary</h1>
  <p>7/24 Siziň hyzmatyňyzda.</p>
</section>

<!-- 🔹 Ürün Kartları -->
<div class="container my-5">
  <div class="row g-4">
    {% for product in products %}
      <div class="col-6 col-md-4 col-lg-3">
        <a href="{% url 'category_view' category_name=product.category %}">
        <div class="card h-100 shadow-sm">
          <img src="{{ product.image.url }}" class="card-img-top" alt="{{ product.name }}">
          <div class="card-body text-center">
            <h5 class="card-title">{{ product.category }}</h5>
          </div>
          </a>
        </div>
      </div>
    {% endfor %}
  </div>
</div>

<!-- 🔹 Footer -->
<footer>
  © 2025 FoodShop — Tüm Hakları Saklıdır
</footer>

<!-- Bootstrap 5 JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
